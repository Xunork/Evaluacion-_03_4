{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="form">
  <h1>{{ titulo }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div style="display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap;">
      <button class="btn" type="submit">Guardar producto</button>
      <a class="btn ghost" href="{% url 'tienda' %}">Cancelar y volver al listado</a>
      <a class="btn ghost" href="{% url 'panel_admin' %}">Ir al panel</a>
    </div>
  </form>
</div>
{% endblock %}
